services:
  app:
    build: .
    container_name: recruit-me-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:80"
      - "5174:5174"  # Vite
    environment:
      - APP_NAME=AppliFlow
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=recruit_me
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db
      - redis
    networks:
      - recruit-me-network

  db:
    image: mysql:8.0
    container_name: recruit-me-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recruit_me
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - recruit-me-network

  redis:
    image: redis:7-alpine
    container_name: recruit-me-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - recruit-me-network
    command: redis-server --appendonly yes

  migrate:
    build: .
    container_name: recruit-me-migrate
    working_dir: /var/www/html
    command: bash -c "sleep 30 && php artisan migrate --force"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - recruit-me-network
    restart: "no"

volumes:
  mysql_data:
  redis_data:

networks:
  recruit-me-network:
    driver: bridge