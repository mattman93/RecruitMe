<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="afGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Welcome to text - centered -->
  <text x="400" y="60" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="400" fill="white" text-anchor="middle">Welcome to</text>
  
  <!-- Centered AF and AppliFlow group -->
  <g transform="translate(150, 100)">
    <!-- Stylized AF -->
    <path d="M0 100 L30 20 L60 100 M15 65 L45 65" stroke="url(#afGradient)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 20 L80 100 M80 20 L130 20 M80 60 L115 60" stroke="url(#afGradient)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flow wave -->
    <path d="M15 110 Q45 120 75 110 Q105 100 135 110" stroke="url(#afGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- AppliFlow text - positioned right after AF -->
    <text x="160" y="70" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="600" fill="white">AppliFlow</text>
    
    <!-- Trademark - positioned close to end of "Flow" -->
    <text x="460" y="45" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="white">®</text>
  </g>
</svg>